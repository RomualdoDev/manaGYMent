<div class="brand-bar">
  <div class="brand-bar-inner">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="color: var(--accent)">
      <path d="M6 6v12M18 6v12M3 9v6M21 9v6M6 12h12"/>
    </svg>
    <span class="brand-name">Mana<span>gym</span>ent</span>

    <div class="session" *ngIf="auth.user() as user">
      <span>{{ user.name }} ({{ user.role === 'ADMIN' ? 'administrador' : 'academia' }})</span>
      <button type="button" class="btn btn-ghost btn-sm" (click)="logout()">Sair</button>
    </div>
  </div>
</div>

<router-outlet />
