<main class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Trocar senha</h1>
    <p class="auth-hint" *ngIf="forced">
      Esta é sua primeira entrada. Defina uma nova senha para continuar.
    </p>

    <label class="auth-field">
      <span>Senha atual</span>
      <input type="password" formControlName="currentPassword" autocomplete="current-password" />
    </label>

    <label class="auth-field">
      <span>Nova senha (mínimo 8 caracteres)</span>
      <input type="password" formControlName="newPassword" autocomplete="new-password" />
    </label>

    <label class="auth-field">
      <span>Confirme a nova senha</span>
      <input type="password" formControlName="confirmation" autocomplete="new-password" />
    </label>

    <p class="form-error" *ngIf="form.hasError('mismatch') && form.touched" role="alert">
      As senhas não coincidem
    </p>
    <p class="form-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

    <button type="submit" class="btn btn-primary auth-submit" [disabled]="form.invalid || submitting">
      {{ submitting ? 'Salvando...' : 'Salvar nova senha' }}
    </button>
  </form>
</main>
