<form class="client-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="grid">
    <label class="field span-2" [class.invalid]="isInvalid('name')">
      <span>Nome</span>
      <input formControlName="name" placeholder="Nome completo" autocomplete="off" />
      <small *ngIf="isInvalid('name')">{{ fieldError('name') }}</small>
    </label>

    <label class="field" [class.invalid]="isInvalid('cpf')">
      <span>CPF</span>
      <input formControlName="cpf" appMask="cpf" placeholder="000.000.000-00" inputmode="numeric" autocomplete="off" />
      <small *ngIf="isEdit">CPF não pode ser alterado</small>
      <small *ngIf="!isEdit && isInvalid('cpf')">{{ fieldError('cpf') }}</small>
    </label>

    <label class="field" [class.invalid]="isInvalid('age')">
      <span>Idade</span>
      <input type="number" formControlName="age" min="0" max="150" />
      <small *ngIf="isInvalid('age')">{{ fieldError('age') }}</small>
    </label>

    <label class="field" [class.invalid]="isInvalid('email')">
      <span>Email</span>
      <input type="email" formControlName="email" placeholder="nome@exemplo.com" autocomplete="off" />
      <small *ngIf="isInvalid('email')">{{ fieldError('email') }}</small>
    </label>

    <label class="field" [class.invalid]="isInvalid('phoneNumber')">
      <span>Telefone</span>
      <input formControlName="phoneNumber" appMask="phone" placeholder="(11) 99999-9999" inputmode="tel" autocomplete="off" />
      <small *ngIf="isInvalid('phoneNumber')">{{ fieldError('phoneNumber') }}</small>
    </label>

    <label class="field" [class.invalid]="isInvalid('billingDay')">
      <span>Dia de vencimento</span>
      <select formControlName="billingDay">
        <option *ngFor="let day of billingDays" [ngValue]="day">{{ day }}</option>
      </select>
      <small *ngIf="isInvalid('billingDay')">{{ fieldError('billingDay') }}</small>
      <small *ngIf="!isInvalid('billingDay') && showMonthEndHint">Em meses mais curtos, vence no último dia do mês.</small>
    </label>
  </div>

  <p class="form-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

  <footer class="form-actions">
    <button type="button" class="btn btn-ghost" (click)="cancelled.emit()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="saving">
      {{ saving ? 'Salvando...' : isEdit ? 'Salvar alterações' : 'Cadastrar cliente' }}
    </button>
  </footer>
</form>
